name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --collect-all panda3d --add-data "data.json;." --add-data "assets;assets" main.py
        # --collect-all panda3d ensures Panda3D's graphics drivers, audio plugins, and Config.prc are safely bundled

    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.exe
        generate_release_notes: true