name: Build and Release ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "requirements.txt") { pip install -r requirements.txt }

    - name: Build with PyInstaller (Folder Mode)
      run: |
        pyinstaller --onedir --windowed --collect-all panda3d --collect-data ursina --add-data "data.json;." --add-data "config.json;." --add-data "assets;assets" main.py

    - name: Zip the Build Folder
      run: |
        Compress-Archive -Path "dist/main" -DestinationPath "TimmyRedbullRunner-Windows.zip"

    - name: Upload to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: TimmyRedbullRunner-Windows.zip
        generate_release_notes: true

    - name: Send Discord Notification
      shell: pwsh
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        $body = @{
            content = "A new build for **${{ github.ref_name }}** has been released!`nDownload it here: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        } | ConvertTo-Json
        
        Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -Body $body -ContentType 'application/json'